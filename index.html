<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Sprite Player</title>
    <style>
      @font-face {
          font-family: 'monogram';
          src: url('fonts/monogram.ttf') format('truetype');
      }
      body {
       cursor: url('cursors/cursor_default.png'), auto;
      }
      .pointer-cursor {
        cursor: url('cursors/cursor_select.png'), pointer;
      }
      .grab-cursor {
        cursor: url('cursors/cursor_grab.png'), grab;
      }
      .grabbing-cursor {
        cursor: url('cursors/cursor_grabbing.png'), grabbing;
      }
    </style>
  </head>
  <body>
    <div style="font-family:monogram; position:absolute; left:-1000px; visibility:hidden;">.</div>
    <div id="dropzone"></div>
  </body>
</html>
